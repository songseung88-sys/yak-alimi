name: Build Yak Alimi Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - v21source/**
      - v22patch/**
      - v30patch/**
      - v301patch/**
      - v302patch/**
      - v303patch/**
      - playstore/**
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Android v2.1 base project
        shell: bash
        run: |
          cat v21source/part* > v21source.full.b64
          test "$(wc -c < v21source.full.b64)" -eq 37292
          base64 --decode v21source.full.b64 > yak-alimi-v2.1-source.tar.gz
          echo "de77571b93186083e4356b91ddba829df6cd904921124fe2dc5eb58ea7a877c7  yak-alimi-v2.1-source.tar.gz" | sha256sum -c -
          tar -xzf yak-alimi-v2.1-source.tar.gz
          test -f yak_alimi_v21_work/app/build.gradle

      - name: Restore v2.2 base features
        shell: bash
        run: |
          python v22patch/apply_v22.py
          test -f yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AppMigration.java

      - name: Apply v3.0 overlay
        shell: bash
        run: |
          cat v30patch/part* > v30-overlay.full.b64
          test "$(wc -c < v30-overlay.full.b64)" -eq 35020
          base64 --decode v30-overlay.full.b64 > v30-overlay.tar.gz
          echo "43bb00c22d9372d88bc10e2584661820c08702736e478b5c4866106d58e545e2  v30-overlay.tar.gz" | sha256sum -c -
          tar -tzf v30-overlay.tar.gz >/dev/null
          tar -xzf v30-overlay.tar.gz -C yak_alimi_v21_work
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' yak_alimi_v21_work/gradle.properties
          sed -i '/import com.google.android.ump.PrivacyOptionsRequirementStatus;/d' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java
          sed -i 's/PrivacyOptionsRequirementStatus.REQUIRED/ConsentInformation.PrivacyOptionsRequirementStatus.REQUIRED/' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java
          grep -q "android.useAndroidX=true" yak_alimi_v21_work/gradle.properties
          grep -q "ConsentInformation.PrivacyOptionsRequirementStatus.REQUIRED" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java
          grep -q "play-services-ads:25.5.0" yak_alimi_v21_work/app/build.gradle
          grep -q "billing:9.1.0" yak_alimi_v21_work/app/build.gradle

      - name: Apply v3.0.1 patch
        shell: bash
        run: |
          python v301patch/apply_v301.py
          grep -q "versionCode 31" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '3.0.1'" yak_alimi_v21_work/app/build.gradle

      - name: Apply v3.0.2 patch
        shell: bash
        run: |
          python v302patch/apply_v302.py
          grep -q "versionCode 32" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '3.0.2'" yak_alimi_v21_work/app/build.gradle

      - name: Apply v3.0.3 patches
        shell: bash
        run: |
          python v303patch/apply_v303.py
          python v303patch/apply_restore_copy.py
          grep -q "versionCode 33" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '3.0.3'" yak_alimi_v21_work/app/build.gradle
          grep -q "premium_price_line" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/I18n.java
          grep -q "getPremiumFormattedPrice" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/BillingManager.java
          grep -q "premium_helper" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java
          grep -q "이전 구매 복구" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/I18n.java
          grep -q "restore_purchase_desc" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java

      - name: Target Android 16
        shell: bash
        run: |
          python v303patch/apply_api36.py
          grep -q 'compileSdk 36' yak_alimi_v21_work/app/build.gradle
          grep -q 'targetSdk 36' yak_alimi_v21_work/app/build.gradle
          grep -q 'versionCode 34' yak_alimi_v21_work/app/build.gradle
          grep -q 'versionName '\''3.0.4'\''' yak_alimi_v21_work/app/build.gradle
          grep -q "version '8.10.1'" yak_alimi_v21_work/build.gradle

      - name: Apply v3.0.5 repeat full-screen reminder fix
        shell: bash
        run: |
          python v303patch/apply_v305_repeat_fullscreen.py
          grep -q 'versionCode 36' yak_alimi_v21_work/app/build.gradle
          grep -q 'versionName '\''3.0.5'\''' yak_alimi_v21_work/app/build.gradle
          grep -q 'secondaryNotificationId' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/NotificationHelper.java
          grep -q 'if (second) c.getSystemService(NotificationManager.class).cancel(baseNid);' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/NotificationHelper.java

      - name: Apply v3.0.6 medication icon system
        shell: bash
        run: |
          python v303patch/apply_v306_medication_icons.py
          python v303patch/apply_v306_icon_compile_fix.py
          grep -q 'versionCode 38' yak_alimi_v21_work/app/build.gradle
          grep -q 'versionName '\''3.0.6'\''' yak_alimi_v21_work/app/build.gradle
          test -f yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MedicationIconStore.java
          test -f yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MedicationIconView.java
          grep -q 'setMinimumWidth((int)dp(36))' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MedicationIconView.java
          grep -q 'medicine_icon' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/I18n.java
          grep -q 'editDraftIcon' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java
          grep -q 'MedicationIconView pill' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/FullScreenAlarmActivity.java

      - name: Create closed-test Premium variant
        shell: bash
        run: |
          cp -a yak_alimi_v21_work yak_alimi_closedtest_work
          python v303patch/apply_closed_test_premium.py yak_alimi_closedtest_work
          # v3.0.6 production uses versionCode 38. The closed-test Premium
          # variant uses 39 so it can replace prior closed-test builds.
          sed -i 's/versionCode 38/versionCode 39/' yak_alimi_closedtest_work/app/build.gradle
          grep -q 'versionCode 38' yak_alimi_v21_work/app/build.gradle
          grep -q 'versionCode 39' yak_alimi_closedtest_work/app/build.gradle
          grep -q "CLOSED_TEST_PREMIUM = true" yak_alimi_closedtest_work/app/src/main/java/com/yakalimi/app/BillingManager.java
          grep -q "test_premium_active" yak_alimi_closedtest_work/app/src/main/java/com/yakalimi/app/I18n.java
          grep -q "isClosedTestPremium" yak_alimi_closedtest_work/app/src/main/java/com/yakalimi/app/MainActivity.java
          ! grep -q "CLOSED_TEST_PREMIUM = true" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/BillingManager.java
          grep -q 'secondaryNotificationId' yak_alimi_closedtest_work/app/src/main/java/com/yakalimi/app/NotificationHelper.java
          test -f yak_alimi_closedtest_work/app/src/main/java/com/yakalimi/app/MedicationIconView.java

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Build production APK and AAB
        shell: bash
        run: |
          cd yak_alimi_v21_work
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build closed-test Premium APK and AAB
        shell: bash
        run: |
          cd yak_alimi_closedtest_work
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect release artifacts and apksigner
        shell: bash
        run: |
          PROD_APK=$(find yak_alimi_v21_work/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          PROD_AAB=$(find yak_alimi_v21_work/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          TEST_APK=$(find yak_alimi_closedtest_work/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          TEST_AAB=$(find yak_alimi_closedtest_work/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -n "$PROD_APK" && test -n "$PROD_AAB" && test -n "$TEST_APK" && test -n "$TEST_AAB"
          cp "$PROD_APK" yak-alimi-v3.0.6-production-unsigned.apk
          cp "$PROD_AAB" yak-alimi-v3.0.6-production-unsigned.aab
          cp "$TEST_APK" yak-alimi-v3.0.6-closedtest-unsigned.apk
          cp "$TEST_AAB" yak-alimi-v3.0.6-closedtest-unsigned.aab
          SIGNER=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          test -n "$SIGNER"
          cp "$SIGNER" apksigner.jar
          unzip -tq yak-alimi-v3.0.6-production-unsigned.apk >/dev/null
          unzip -tq yak-alimi-v3.0.6-production-unsigned.aab >/dev/null
          unzip -tq yak-alimi-v3.0.6-closedtest-unsigned.apk >/dev/null
          unzip -tq yak-alimi-v3.0.6-closedtest-unsigned.aab >/dev/null

      - name: Upload Play Store preparation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yak-alimi-v3.0.6-production-and-closedtest-inputs
          path: |
            yak-alimi-v3.0.6-production-unsigned.apk
            yak-alimi-v3.0.6-production-unsigned.aab
            yak-alimi-v3.0.6-closedtest-unsigned.apk
            yak-alimi-v3.0.6-closedtest-unsigned.aab
            apksigner.jar
          if-no-files-found: error
