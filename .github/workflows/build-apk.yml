name: Build Yak Alimi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source_parts/**
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          cat source_parts/source.part* > source.full.b64
          test "$(wc -c < source.full.b64)" -eq 28212
          base64 --decode source.full.b64 > yak-alimi-source.zip
          unzip -tq yak-alimi-source.zip
          unzip -q yak-alimi-source.zip
          test -f yak_alimi_android/app/build.gradle

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20

      - name: Run inventory logic test
        shell: bash
        run: |
          cd yak_alimi_android
          javac tools/InventoryLogicTest.java
          java -cp tools InventoryLogicTest

      - name: Build debug APK
        shell: bash
        run: |
          cd yak_alimi_android
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp yak_alimi_android/app/build/outputs/apk/debug/app-debug.apk yak-alimi-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yak-alimi-v1-apk
          path: yak-alimi-v1.apk
          if-no-files-found: error
