name: Build Yak Alimi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - v21source/**
      - v22patch/**
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android v2.1 base project
        shell: bash
        run: |
          cat v21source/part* > v21source.full.b64
          test "$(wc -c < v21source.full.b64)" -eq 37292
          base64 --decode v21source.full.b64 > yak-alimi-v2.1-source.tar.gz
          echo "de77571b93186083e4356b91ddba829df6cd904921124fe2dc5eb58ea7a877c7  yak-alimi-v2.1-source.tar.gz" | sha256sum -c -
          tar -tzf yak-alimi-v2.1-source.tar.gz >/dev/null
          tar -xzf yak-alimi-v2.1-source.tar.gz
          test -f yak_alimi_v21_work/app/build.gradle

      - name: Apply v2.2.1 update and migration patch
        shell: bash
        run: |
          python v22patch/apply_v22.py
          sed -i 's/versionCode 22/versionCode 23/' yak_alimi_v21_work/app/build.gradle
          sed -i "s/versionName '2.2.0'/versionName '2.2.1'/" yak_alimi_v21_work/app/build.gradle
          grep -q "versionCode 23" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '2.2.1'" yak_alimi_v21_work/app/build.gradle
          test -f yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AppMigration.java
          test -f yak_alimi_v21_work/app/src/main/res/drawable-anydpi-v33/ic_launcher.xml

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          ls "$ANDROID_HOME/build-tools" | tail -20

      - name: Build unsigned release APK
        shell: bash
        run: |
          cd yak_alimi_v21_work
          gradle :app:assembleRelease --stacktrace

      - name: Collect unsigned APK and apksigner
        shell: bash
        run: |
          APK=$(find yak_alimi_v21_work/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -n "$APK"
          cp "$APK" yak-alimi-v2.2.1-unsigned.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          test -n "$SIGNER"
          cp "$SIGNER" apksigner.jar
          unzip -tq yak-alimi-v2.2.1-unsigned.apk >/dev/null

      - name: Upload unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: yak-alimi-v2.2.1-signing-inputs
          path: |
            yak-alimi-v2.2.1-unsigned.apk
            apksigner.jar
          if-no-files-found: error
