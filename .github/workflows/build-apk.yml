name: Build Yak Alimi Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - v21source/**
      - v22patch/**
      - v30patch/**
      - v301patch/**
      - v302patch/**
      - v303patch/**
      - playstore/**
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android v2.1 base project
        shell: bash
        run: |
          cat v21source/part* > v21source.full.b64
          test "$(wc -c < v21source.full.b64)" -eq 37292
          base64 --decode v21source.full.b64 > yak-alimi-v2.1-source.tar.gz
          echo "de77571b93186083e4356b91ddba829df6cd904921124fe2dc5eb58ea7a877c7  yak-alimi-v2.1-source.tar.gz" | sha256sum -c -
          tar -xzf yak-alimi-v2.1-source.tar.gz
          test -f yak_alimi_v21_work/app/build.gradle

      - name: Restore v2.2 base features
        shell: bash
        run: |
          python v22patch/apply_v22.py
          test -f yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AppMigration.java

      - name: Apply v3.0 overlay
        shell: bash
        run: |
          cat v30patch/part* > v30-overlay.full.b64
          test "$(wc -c < v30-overlay.full.b64)" -eq 35020
          base64 --decode v30-overlay.full.b64 > v30-overlay.tar.gz
          echo "43bb00c22d9372d88bc10e2584661820c08702736e478b5c4866106d58e545e2  v30-overlay.tar.gz" | sha256sum -c -
          tar -tzf v30-overlay.tar.gz >/dev/null
          tar -xzf v30-overlay.tar.gz -C yak_alimi_v21_work
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' yak_alimi_v21_work/gradle.properties
          sed -i '/import com.google.android.ump.PrivacyOptionsRequirementStatus;/d' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java
          sed -i 's/PrivacyOptionsRequirementStatus.REQUIRED/ConsentInformation.PrivacyOptionsRequirementStatus.REQUIRED/' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java
          grep -q "android.useAndroidX=true" yak_alimi_v21_work/gradle.properties
          grep -q "ConsentInformation.PrivacyOptionsRequirementStatus.REQUIRED" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java
          grep -q "play-services-ads:25.5.0" yak_alimi_v21_work/app/build.gradle
          grep -q "billing:9.1.0" yak_alimi_v21_work/app/build.gradle

      - name: Apply v3.0.1 patch
        shell: bash
        run: |
          python v301patch/apply_v301.py
          grep -q "versionCode 31" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '3.0.1'" yak_alimi_v21_work/app/build.gradle

      - name: Apply v3.0.2 patch
        shell: bash
        run: |
          python v302patch/apply_v302.py
          grep -q "versionCode 32" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '3.0.2'" yak_alimi_v21_work/app/build.gradle

      - name: Apply v3.0.3 Premium patch
        shell: bash
        run: |
          python v303patch/apply_v303.py
          python v303patch/apply_restore_copy.py
          grep -q "versionCode 33" yak_alimi_v21_work/app/build.gradle
          grep -q "versionName '3.0.3'" yak_alimi_v21_work/app/build.gradle
          grep -q "premium_price_line" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/I18n.java
          grep -q "getPremiumFormattedPrice" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/BillingManager.java
          grep -q "premium_helper" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java
          grep -q "이전 구매 복구" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/I18n.java
          grep -q "restore_purchase_desc" yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Build unsigned APK and AAB
        shell: bash
        run: |
          cd yak_alimi_v21_work
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect release artifacts and apksigner
        shell: bash
        run: |
          APK=$(find yak_alimi_v21_work/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          AAB=$(find yak_alimi_v21_work/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" yak-alimi-v3.0.3-unsigned.apk
          cp "$AAB" yak-alimi-v3.0.3-unsigned.aab
          SIGNER=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          test -n "$SIGNER"
          cp "$SIGNER" apksigner.jar
          unzip -tq yak-alimi-v3.0.3-unsigned.apk >/dev/null
          unzip -tq yak-alimi-v3.0.3-unsigned.aab >/dev/null

      - name: Upload Play Store preparation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yak-alimi-v3.0.3-playstore-inputs
          path: |
            yak-alimi-v3.0.3-unsigned.apk
            yak-alimi-v3.0.3-unsigned.aab
            apksigner.jar
          if-no-files-found: error
