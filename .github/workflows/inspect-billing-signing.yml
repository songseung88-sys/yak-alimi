name: Inspect billing and signing

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/inspect-billing-signing.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current source
        shell: bash
        run: |
          cat v21source/part* > v21source.full.b64
          base64 --decode v21source.full.b64 > yak-alimi-v2.1-source.tar.gz
          tar -xzf yak-alimi-v2.1-source.tar.gz
          python v22patch/apply_v22.py
          cat v30patch/part* > v30-overlay.full.b64
          base64 --decode v30-overlay.full.b64 > v30-overlay.tar.gz
          tar -xzf v30-overlay.tar.gz -C yak_alimi_v21_work
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' yak_alimi_v21_work/gradle.properties
          sed -i '/import com.google.android.ump.PrivacyOptionsRequirementStatus;/d' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java || true
          sed -i 's/PrivacyOptionsRequirementStatus.REQUIRED/ConsentInformation.PrivacyOptionsRequirementStatus.REQUIRED/' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java || true
          python v301patch/apply_v301.py
          python v302patch/apply_v302.py
          python v303patch/apply_v303.py
          python v303patch/apply_restore_copy.py
          python v303patch/apply_api36.py
          python v303patch/apply_v305_repeat_fullscreen.py
          python v303patch/apply_v306_medication_icons.py
          python v303patch/apply_v306_icon_compile_fix.py
          python v303patch/apply_v307_support_options.py
          python v303patch/apply_v308_aligned_repeat_reminders.py
          python v303patch/apply_v309_per_medicine_repeat_interval.py
          python v303patch/apply_v310_grouped_overlapping_reminders.py
          python v303patch/apply_v311_alarm_auto_stop.py
      - name: Print billing and signing relevant source
        shell: bash
        run: |
          D=yak_alimi_v21_work/app/src/main/java/com/yakalimi/app
          echo '===== BillingManager ====='
          cat "$D/BillingManager.java"
          echo '===== build.gradle ====='
          cat yak_alimi_v21_work/app/build.gradle
          echo '===== support call sites ====='
          grep -n -A8 -B8 'supportDeveloper\|support_coffee\|support_meal\|support_payment_coming' "$D/MainActivity.java" "$D/I18n.java" || true
          echo '===== signing-like files in repo ====='
          find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' \) -print
