name: Inspect history editor source
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/inspect-history-editor.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source
        shell: bash
        run: |
          cat v21source/part* > v21source.full.b64
          base64 --decode v21source.full.b64 > yak-alimi-v2.1-source.tar.gz
          tar -xzf yak-alimi-v2.1-source.tar.gz
          python v22patch/apply_v22.py
          cat v30patch/part* > v30-overlay.full.b64
          base64 --decode v30-overlay.full.b64 > v30-overlay.tar.gz
          tar -xzf v30-overlay.tar.gz -C yak_alimi_v21_work
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' yak_alimi_v21_work/gradle.properties
          sed -i '/import com.google.android.ump.PrivacyOptionsRequirementStatus;/d' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java || true
          sed -i 's/PrivacyOptionsRequirementStatus.REQUIRED/ConsentInformation.PrivacyOptionsRequirementStatus.REQUIRED/' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AdsManager.java || true
          python v301patch/apply_v301.py
          python v302patch/apply_v302.py
          python v303patch/apply_v303.py
          python v303patch/apply_restore_copy.py
          python v303patch/apply_api36.py
          python v303patch/apply_v305_repeat_fullscreen.py
          python v303patch/apply_v306_medication_icons.py
          python v303patch/apply_v306_icon_compile_fix.py
          python v303patch/apply_v307_support_options.py
          python v303patch/apply_v308_aligned_repeat_reminders.py
          python v303patch/apply_v309_per_medicine_repeat_interval.py
          python v303patch/apply_v310_grouped_overlapping_reminders.py
          python v303patch/apply_v311_alarm_auto_stop.py
          python v303patch/apply_v312_ids_fixed.py
          python v303patch/apply_v312_billing_catalog.py
          python v303patch/apply_v312_billing_launch.py
          python v303patch/apply_v312_support_consumption.py
          python v303patch/apply_v312_support_ui.py
          python v303patch/apply_v313_support_reward_store.py
          python v303patch/apply_v313_support_reward_grant.py
          python v303patch/apply_v313_support_card_ui.py
          python v303patch/apply_v312_version.py
          python v303patch/apply_v313_version.py
          python v303patch/apply_v314_version.py
          python v303patch/apply_v315_version.py
          python v303patch/apply_v316_fresh_billing_prices.py
          python v303patch/apply_v316_version.py
      - name: Dump relevant code
        shell: bash
        run: |
          echo '===== MedicationStore ====='
          cat yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MedicationStore.java
          echo '===== MainActivity history ====='
          python - <<'PY'
          from pathlib import Path
          s=Path('yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java').read_text()
          a=s.index('    private void showHistory()')
          b=s.index('    private void moveHistoryMonth',a)
          print(s[a:b+1200])
          PY
          echo '===== confirmUndo ====='
          python - <<'PY'
          from pathlib import Path
          s=Path('yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/MainActivity.java').read_text()
          a=s.find('    private void confirmUndo')
          print(s[a:a+2200] if a>=0 else 'not found')
          PY
          echo '===== AlarmScheduler APIs ====='
          grep -nE 'public static|static void' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/AlarmScheduler.java || true
          echo '===== I18n record keys ====='
          grep -nE 'record|taken|missed|scheduled|undo|history|calendar' yak_alimi_v21_work/app/src/main/java/com/yakalimi/app/I18n.java || true
